name: VERA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    # The dashboard read API + governance stores are backed by Redis.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379/0
      VERA_AUTH_MODE: guided
      VERA_ARTIFACT_BACKEND: local
      VERA_MLFLOW_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -m "not gpu and not slow" -q

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      VERA_INTEGRATION: "1"
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: vera
    steps:
      - uses: actions/checkout@v4
      # MinIO withdrew its own images from Docker Hub in September 2026. Chainguard
      # publishes a maintained build, which needs explicit server arguments, so it
      # runs as a step rather than as a service container.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live > /dev/null && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy"; docker logs minio; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/ -m integration -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # The lockfile is generated on macOS; some Linux-only optional deps (e.g. @emnapi/*)
      # are absent, which `npm ci` rejects on Linux. Fall back to a reconciling install.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
        env:
          NEXT_PUBLIC_AUTH_MODE: guided
      - run: npx playwright install chromium
        working-directory: dashboard
      - run: npx playwright test
        working-directory: dashboard
        env:
          CI: "1"
          NEXT_PUBLIC_AUTH_DISABLED: "1"
